<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" width="980" height="460" font-family="Space Grotesk, Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0a14"/>
      <stop offset="1" stop-color="#07050a"/>
    </linearGradient>
    <linearGradient id="skyBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6c5b2"/>
      <stop offset="1" stop-color="#79b5c6"/>
    </linearGradient>
    <linearGradient id="voidBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#231338"/>
      <stop offset="1" stop-color="#100b1c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7c8aa5"/>
    </marker>
  </defs>

  <rect width="980" height="460" fill="url(#bg)"/>
  <text x="30" y="38" fill="#f4effb" font-size="20" font-weight="700">Driftline Arcade — Application Architecture</text>

  <!-- App shell -->
  <rect x="30" y="66" width="920" height="60" rx="10" fill="#17111f" stroke="#342344"/>
  <text x="50" y="90" fill="#f4effb" font-size="15" font-weight="700">App.tsx</text>
  <text x="50" y="110" fill="#a79ab9" font-size="12">HashRouter — three routes rendered by React 19</text>

  <line x1="150" y1="126" x2="150" y2="160" stroke="#7c8aa5" marker-end="url(#arrow)"/>
  <line x1="490" y1="126" x2="490" y2="160" stroke="#7c8aa5" marker-end="url(#arrow)"/>
  <line x1="820" y1="126" x2="820" y2="160" stroke="#7c8aa5" marker-end="url(#arrow)"/>

  <!-- HomePage -->
  <rect x="40" y="160" width="220" height="86" rx="10" fill="#1a1424" stroke="#342344"/>
  <text x="58" y="186" fill="#f4effb" font-size="14" font-weight="700">HomePage</text>
  <text x="58" y="205" fill="#a79ab9" font-size="11">GamePanel × 2</text>
  <text x="58" y="221" fill="#a79ab9" font-size="11">AmbientCanvas preview</text>
  <text x="58" y="237" fill="#a79ab9" font-size="11">SplitPanelController</text>

  <!-- SkyfoldPage -->
  <rect x="380" y="160" width="220" height="86" rx="10" fill="url(#skyBox)" opacity="0.16" stroke="#e77b69"/>
  <text x="398" y="186" fill="#f4effb" font-size="14" font-weight="700">SkyfoldPage</text>
  <text x="398" y="205" fill="#d7cdb7" font-size="11">HUD + 3 overlays</text>
  <text x="398" y="221" fill="#d7cdb7" font-size="11">Leaderboard form</text>
  <text x="398" y="237" fill="#d7cdb7" font-size="11">Touch d-pad + fire</text>

  <!-- VoidrunnerPage -->
  <rect x="710" y="160" width="220" height="86" rx="10" fill="url(#voidBox)" stroke="#22d3ee"/>
  <text x="728" y="186" fill="#f4effb" font-size="14" font-weight="700">VoidrunnerPage</text>
  <text x="728" y="205" fill="#a79ab9" font-size="11">Hero + HUD + stage</text>
  <text x="728" y="221" fill="#a79ab9" font-size="11">Leaderboard sidebar</text>
  <text x="728" y="237" fill="#a79ab9" font-size="11">Hold-button controls</text>

  <line x1="490" y1="246" x2="490" y2="280" stroke="#7c8aa5" marker-end="url(#arrow)"/>
  <line x1="820" y1="246" x2="820" y2="280" stroke="#7c8aa5" marker-end="url(#arrow)"/>

  <!-- Engine layer -->
  <rect x="330" y="280" width="620" height="70" rx="10" fill="#12101a" stroke="#3a2f52"/>
  <text x="350" y="304" fill="#f4effb" font-size="14" font-weight="700">GameEngine (abstract base class)</text>
  <text x="350" y="323" fill="#a79ab9" font-size="11">requestAnimationFrame loop · ResizeObserver · pause/resume lifecycle</text>

  <line x1="440" y1="350" x2="440" y2="382" stroke="#7c8aa5" marker-end="url(#arrow)"/>
  <line x1="740" y1="350" x2="740" y2="382" stroke="#7c8aa5" marker-end="url(#arrow)"/>

  <rect x="340" y="382" width="200" height="54" rx="8" fill="#1a1424" stroke="#e77b69"/>
  <text x="356" y="405" fill="#f4effb" font-size="13" font-weight="700">SkyfoldEngine</text>
  <text x="356" y="422" fill="#a79ab9" font-size="10">extends GameEngine</text>

  <rect x="640" y="382" width="210" height="54" rx="8" fill="#1a1424" stroke="#22d3ee"/>
  <text x="656" y="405" fill="#f4effb" font-size="13" font-weight="700">VoidrunnerEngine</text>
  <text x="656" y="422" fill="#a79ab9" font-size="10">extends GameEngine</text>

  <!-- Shared services -->
  <rect x="40" y="280" width="260" height="156" rx="10" fill="#12101a" stroke="#342344"/>
  <text x="58" y="304" fill="#f4effb" font-size="14" font-weight="700">Shared Engine Services</text>
  <text x="58" y="328" fill="#a79ab9" font-size="11">InputManager — keyboard, touch, pointer</text>
  <text x="58" y="348" fill="#a79ab9" font-size="11">LeaderboardStore&lt;T&gt; — typed localStorage</text>
  <text x="58" y="368" fill="#a79ab9" font-size="11">MathUtils — clamp, lerp, collisions, rays</text>
  <text x="58" y="388" fill="#a79ab9" font-size="11">AmbientCanvas — React ⇄ GameEngine bridge</text>
  <text x="58" y="408" fill="#a79ab9" font-size="11">SplitPanelController — a11y + touch state</text>

  <line x1="300" y1="358" x2="330" y2="315" stroke="#7c8aa5" marker-end="url(#arrow)"/>
</svg>
