<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07050a" />
    <meta name="description" content="Driftline Arcade: two original browser arcade games, Skyfold Aviary and Voidrunner, built with TypeScript and React." />
    <title>Driftline Arcade</title>
    <script>
      // Companion to public/404.html: rebuilds the real path from the
      // ?p=/...&q=...#... query string GitHub Pages' 404 fallback encoded,
      // so a hard refresh or direct link to /driftlineArcade/skyfold works.
      (function (l) {
        if (l.search.indexOf('?p=') === 0 || l.search.indexOf('&p=') !== -1) {
          var decoded = l.search.slice(1).split('&').reduce(function (acc, pair) {
            var kv = pair.split('=');
            acc[kv[0]] = kv[1];
            return acc;
          }, {});
          if (decoded.p !== undefined) {
            window.history.replaceState(
              null,
              '',
              l.pathname.slice(0, -1) +
                decoded.p.replace(/~and~/g, '&') +
                (decoded.q ? '?' + decoded.q.replace(/~and~/g, '&') : '') +
                l.hash
            );
          }
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
